<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>twitch chat relay</title>
</head>
<body>
<p>Twitch chat relay. Embed this page in an iframe and postMessage
<code>{type: 'join', channel: 'somechannel'}</code> to it; it replies with
<code>{type: 'status', state}</code> and <code>{type: 'lines', lines}</code>
messages containing raw Twitch IRC lines, plus periodic
<code>{type: 'stream', uptime, viewers, title}</code> status from decapi.</p>
<script>
// Anonymous read-only IRC-over-WebSocket relay for hosts whose CSP forbids
// external connect-src (e.g. neocities). GitHub Pages serves no CSP, so the
// WebSocket to Twitch works here and lines are forwarded to the embedder.
(() => {
  const WS_URL = 'wss://irc-ws.chat.twitch.tv:443';
  let ws;
  let channel = null;
  let reconnectAttempt = 0;
  let peer = null; // { source, origin } of the embedding page

  function send(msg) {
    if (peer) peer.source.postMessage(msg, peer.origin);
  }

  function setStatus(state) {
    send({ type: 'status', state });
  }

  function connect() {
    setStatus(reconnectAttempt === 0 ? 'connecting' : 'reconnecting');
    ws = new WebSocket(WS_URL);

    ws.onopen = () => {
      ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
      ws.send('PASS justinfan');
      ws.send('NICK justinfan' + Math.floor(Math.random() * 99999));
      if (channel) ws.send('JOIN #' + channel);
    };

    ws.onmessage = (evt) => {
      const lines = evt.data.split('\r\n').filter(Boolean);
      for (const line of lines) {
        if (line.startsWith('PING')) ws.send('PONG :tmi.twitch.tv');
        else if (line.includes('RECONNECT')) { ws.close(); return; }
        else if (line.includes(' 001 ')) { reconnectAttempt = 0; setStatus('connected'); }
      }
      send({ type: 'lines', lines });
    };

    ws.onclose = scheduleReconnect;
    ws.onerror = () => ws.close();
  }

  function scheduleReconnect() {
    setStatus('reconnecting');
    const delay = Math.min(1000 * 2 ** reconnectAttempt, 30000);
    reconnectAttempt++;
    setTimeout(connect, delay);
  }

  // ---- stream status polling via decapi (public, no auth needed) ----
  const POLL_MS = 60000;
  let pollTimer = null;

  async function pollStream() {
    if (!peer || !channel) return;
    try {
      const [uptime, viewers, title] = await Promise.all([
        fetch(`https://decapi.me/twitch/uptime/${channel}`).then((r) => r.text()),
        fetch(`https://decapi.me/twitch/viewercount/${channel}`).then((r) => r.text()),
        fetch(`https://decapi.me/twitch/title/${channel}`).then((r) => r.text()),
      ]);
      send({
        type: 'stream',
        uptime: uptime.trim(),
        viewers: viewers.trim(),
        title: title.trim(),
      });
    } catch (e) { /* keep last state on transient failure */ }
  }

  // ---- third-party emote sets (7TV/BTTV/FFZ), refetched every 10 min ----
  // The embedder's CSP blocks fetch() but allows img-src *, so the relay
  // resolves the sets here and forwards a plain name -> CDN url map.
  const EMOTE_POLL_MS = 10 * 60 * 1000;
  let emoteTimer = null;
  let lastEmoteJson = null, lastEmotePeer = null;

  async function fetchEmotes() {
    if (!peer || !channel) return;
    const get = (u) => fetch(u).then((r) => (r.ok ? r.json() : null)).catch(() => null);
    const emotes = {};
    const user = await get(`https://api.ivr.fi/v2/twitch/user?login=${channel}`);
    const twitchId = (Array.isArray(user) ? user[0] : user)?.id;
    // Latest VOD via Twitch's public GraphQL client-id: gives the real
    // start and end of the last recorded broadcast.
    const vodGql = fetch('https://gql.twitch.tv/gql', {
      method: 'POST',
      headers: { 'Client-ID': 'kimne78kx3ncx6brgo4mv6wki5h1ko', 'Content-Type': 'application/json' },
      body: JSON.stringify({ query:
        `{ user(login: "${channel.replace(/[^a-zA-Z0-9_]/g, '')}") { videos(first: 1, type: ARCHIVE, sort: TIME) { edges { node { createdAt lengthSeconds } } } } }` }),
    }).then((r) => (r.ok ? r.json() : null)).catch(() => null);
    const [stvUser, stvGlobal, bttvUser, bttvGlobal, ffzRoom, ffzGlobal, vodResp,
           badgesGlobal, badgesChan, ffzAnim] = await Promise.all([
      twitchId ? get(`https://7tv.io/v3/users/twitch/${twitchId}`) : null,
      get('https://7tv.io/v3/emote-sets/global'),
      twitchId ? get(`https://api.betterttv.net/3/cached/users/twitch/${twitchId}`) : null,
      get('https://api.betterttv.net/3/cached/emotes/global'),
      get(`https://api.frankerfacez.com/v1/room/${channel}`),
      get('https://api.frankerfacez.com/v1/set/global'),
      vodGql,
      get('https://api.ivr.fi/v2/twitch/badges/global'),
      twitchId ? get(`https://api.ivr.fi/v2/twitch/badges/channel?id=${twitchId}`) : null,
      twitchId ? get(`https://api.betterttv.net/3/cached/frankerfacez/users/twitch/${twitchId}`) : null,
    ]);
    const emoteSrc = {}, zeroWidth = [];
    const ffzUrl = (e) => {
      const u = e.urls && (e.urls['2'] || e.urls['1']);
      return !u ? null : u.startsWith('http') ? u : 'https:' + u;
    };
    const addFfz = (sets) => {
      for (const set of Object.values(sets || {}))
        for (const e of set.emoticons || [])
          { const u = ffzUrl(e); if (u) { emotes[e.name] = u; emoteSrc[e.name] = 'FFZ'; } }
    };
    const add7tv = (list) => {
      for (const e of list || []) {
        emotes[e.name] = `https://cdn.7tv.app/emote/${e.id}/2x.webp`;
        emoteSrc[e.name] = '7TV';
        if (e.flags & 1) zeroWidth.push(e.name); // overlay emote, stacks on the previous one
      }
    };
    // globals first; channel sets override them
    add7tv(stvGlobal?.emotes);
    for (const e of bttvGlobal || [])
      { emotes[e.code] = `https://cdn.betterttv.net/emote/${e.id}/2x`; emoteSrc[e.code] = 'BTTV'; }
    addFfz(ffzGlobal?.sets);
    add7tv(stvUser?.emote_set?.emotes);
    for (const e of [...(bttvUser?.channelEmotes || []), ...(bttvUser?.sharedEmotes || [])])
      { emotes[e.code] = `https://cdn.betterttv.net/emote/${e.id}/2x`; emoteSrc[e.code] = 'BTTV'; }
    addFfz(ffzRoom?.sets);
    // animated FFZ emotes (FFZ:AP) come through BTTV's frankerfacez cache
    for (const e of ffzAnim || []) {
      const u = e.images?.['2x'] || e.images?.['1x'];
      if (u) { emotes[e.code] = u; emoteSrc[e.code] = 'FFZ animated'; }
    }
    // badge set 'set_id' -> { version: url }; channel sets override globals
    const badges = {};
    for (const s of [...(badgesGlobal || []), ...(badgesChan || [])])
      badges[s.set_id] = { ...(badges[s.set_id] || {}),
        ...Object.fromEntries((s.versions || [])
          .map((v) => [v.id, v.image_url_2x || v.image_url_1x])) };
    const lastBroadcast = (Array.isArray(user) ? user[0] : user)?.lastBroadcast || null;
    const vod = vodResp?.data?.user?.videos?.edges?.[0]?.node;
    const lastVod = vod ? { start: vod.createdAt,
      end: new Date(Date.parse(vod.createdAt) + vod.lengthSeconds * 1000).toISOString() } : null;
    // skip re-sending an identical payload to the same peer: the page would
    // re-walk every chat row for nothing. a fresh join() makes a new peer.
    const json = JSON.stringify([emotes, emoteSrc, zeroWidth, badges, lastBroadcast, lastVod]);
    if (json === lastEmoteJson && peer === lastEmotePeer) return;
    lastEmoteJson = json; lastEmotePeer = peer;
    send({ type: 'emotes', emotes, emoteSrc, zeroWidth, badges, lastBroadcast, lastVod });
  }

  // ---- nitter instance selection via status.d420.de ----
  // The tracker lists live nitter hosts with health and response-time
  // columns; the fastest healthy host is forwarded so the embedder's
  // twitter/x links land on a working mirror instead of a stale one.
  const NITTER_POLL_MS = 15 * 60 * 1000;
  let nitterTimer = null;

  async function fetchNitterHost() {
    if (!peer) return;
    try {
      const html = await fetch('https://status.d420.de/')
        .then((r) => (r.ok ? r.text() : null));
      if (!html) return;
      const doc = new DOMParser().parseFromString(html, 'text/html');
      let best = null, bestMs = Infinity;
      for (const tr of doc.querySelectorAll('table tr')) {
        const host = tr.querySelector('td a[href^="http"]')?.href;
        const healthy = tr.querySelector('span[aria-label="healthy"]');
        const ms = parseInt(tr.querySelector('td[data-name="average"]')?.textContent, 10);
        if (host && healthy && ms > 0 && ms < bestMs) { best = host; bestMs = ms; }
      }
      if (best) send({ type: 'nitter', host: best });
    } catch (e) { /* keep last pick */ }
  }

  window.addEventListener('message', (event) => {
    const d = event.data;
    if (!d || d.type !== 'join' || typeof d.channel !== 'string') return;
    if (!/^https?:/.test(event.origin)) return;
    peer = { source: event.source, origin: event.origin };
    const ch = d.channel.toLowerCase().replace(/[^a-z0-9_]/g, '');
    if (!ch) return;
    const changed = ch !== channel;
    channel = ch;
    if (!pollTimer) pollTimer = setInterval(pollStream, POLL_MS);
    if (!emoteTimer) emoteTimer = setInterval(fetchEmotes, EMOTE_POLL_MS);
    if (!nitterTimer) nitterTimer = setInterval(fetchNitterHost, NITTER_POLL_MS);
    pollStream();
    fetchEmotes();
    fetchNitterHost();
    if (ws && ws.readyState === WebSocket.OPEN) {
      if (changed) ws.send('JOIN #' + channel);
      setStatus('connected');
    } else if (!ws || ws.readyState === WebSocket.CLOSED) {
      connect();
    }
  });
})();
</script>
</body>
</html>
