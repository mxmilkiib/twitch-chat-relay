name = "hasanabi-chat-thing-linkpeek"
main = "linkpeek-worker.js"
compatibility_date = "2026-01-01"
workers_dev = true

# presence relays persist here - the in-isolate `seen` map undercounts when
# traffic shards across nodes; the dataset is global
[[analytics_engine_datasets]]
binding = "RELAYS"
dataset = "hasanabi_chat_thing_use"

# global giphy result store - unlike the per-colo edge cache, one
# viewer's upstream hit serves every viewer until the entry's ttl lapses.
# create it once, then uncomment and paste the id it prints:
#   npx wrangler kv namespace create GIFKV
# [[kv_namespaces]]
# binding = "GIFKV"
# id = "PASTE_ID_HERE"
